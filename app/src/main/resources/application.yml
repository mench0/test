spring:
  application:
    name: profile-manager
  main:
    banner-mode: off
  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      idle-timeout: 60000
      minimum-idle: 0
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        check_nullability: true
        query:
          in_clause_parameter_padding: true
          fail_on_pagination_over_collection_fetch: true
    open-in-view: false
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${spring.redis.host}:${spring.redis.port}"
          password: ${spring.redis.password:}
          connectionMinimumIdleSize: 10
          connectionPoolSize: 64
  sleuth:
    jdbc:
      datasource-proxy:
        enabled: ${JDBC_TRACING_ENABLED:false}
        query:
          enable-logging: false
      includes:
        - CONNECTION
        - QUERY
        - FETCH
    sampler:
      probability: ${TRACING_SAMPLING_PROBABILITY:0} # from 0.00 to 1.00
  zipkin:
    base-url: ${ZIPKIN_BASE_URL:http://localhost:9411/}
  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true

  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:tmsskapps@gmail.com}
    password: ${EMAIL_PASSWORD:kyfewgqmcefpkddc}
    from: ${EMAIL_FROM:tms@uzcard.uz}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    protocol: smtp

security:
  admin:
    default-email: ${ADMIN_DEFAULT_EMAIL:tmsskapps@gmail.com}
    # if default password is null then password will be generated and sent to admin email
    default-password: ${ADMIN_DEFAULT_PASSWORD:#{null}}
  system-user:
    username: default_system_user
    password: dxzW9mWvPFBCQ7eEJbm0sIfsd78sn4
    default-terminal-password: axzW95WvPFnCQ7eE2bm0sIfsd18sn0
  jwt:
    secret: ${JWT_SECRET}

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}


integration:
  rkl:
    custom-url-required: ${RKL_CUSTOM_URL_REQUIRED:true}
    default-request-url: ${RKL_REQUEST-URL:https://undefined-rkl-url}
    add-url-to-device-view: ${RKL_ADD_URL_TO_DEVICE_VIEW:false}
  skapps:
    user: ${SKAPPS_USER:skappTms}
    password: ${SKAPPS_PASSWORD:uh^567(*g$12hv}
    host: ${SKAPPS_HOST:skapps-back.smartsoft.am}
    auth-path: ${SKAPPS_AUTH_PATH:/api/v1/auth/tms/sign-in}
    terminal-path: ${SKAPPS_TERMINAL_PATH:/api/v1/tms/terminals}
    merchant-path: ${SKAPPS_MERCHANT_PATH:/api/v1/tms/merchants}
    job:
      shedlock: ${SKAPPS_SHEDLOCK:true}
      fixed-delay: ${SKAPPS_SCHEDULER_FIXED_DELAY_IN_MILLIS:10000}
  response-timeout: ${RESPONSE_TIMEOUT:PT10S}
  connection-timeout: ${CONNECTION_TIMEOUT:PT10S}


resilience4j:
  circuitbreaker:
    instances:
      getTerminalExtendedInfo:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        sliding-window-type: TIME_BASED
        sliding-window-size: 10 # seconds
        minimum-number-of-calls: 100
        record-failure-predicate: com.tms.profilemanager.app.utils.CircuitBreakerExceptionPredicate

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]": 500ms, 2s, 5s
    tags:
      application: ${spring.application.name}
  endpoint:
    info:
      enabled: true
    health:
      enabled: true
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          show-details: always
          include:
            - livenessState
        readiness:
          show-details: always
          include:
            - readinessState
            - migrations
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

springdoc:
  swagger-ui:
    docExpansion: none
    filter: true
    tagsSorter: alpha
    displayRequestDuration: true
    disable-swagger-default-url: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

logbook:
  log-request-body: true
  log-successful-requests: true
  secure-filter:
    enabled: false

logging:
  level:
    org.zalando.logbook: trace

humo:
  humo-acquirer-name: ${HUMO_ACQUIRER_NAME:Humo}
  enable: ${HUMO_ENABLE:false}
  job:
    shedlock: ${HUMO_SHEDLOCK:true}
    scheduler: ${HUMO_SCHEDULER_CRON:0 */5 * * * *}

multimerchant:
  disabled-acquirers: ${DISABLED_ACQUIRERS:Humo}
  disabled-softwares: ${DISABLED_SOFTWARES:Era POS}

skapps:
